---
- name: Install ClickHouse
  hosts: clickhouse
  become: true
  tags: [clickhouse]
  tasks:
    - name: Install repository prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, python3-debian]
        update_cache: true
        cache_valid_time: 3600
    - name: Download ClickHouse key
      ansible.builtin.get_url:
        url: https://packages.clickhouse.com/rpm/lts/repodata/repomd.xml.key
        dest: /usr/share/keyrings/clickhouse.asc
        mode: '0644'
    - name: Configure repository
      ansible.builtin.apt_repository:
        repo: deb [signed-by=/usr/share/keyrings/clickhouse.asc] https://packages.clickhouse.com/deb stable main
        filename: clickhouse
    - name: Install packages
      ansible.builtin.apt:
        name: [clickhouse-server, clickhouse-client]
      environment:
        DEBIAN_FRONTEND: noninteractive
    - name: Configure ClickHouse
      ansible.builtin.template:
        src: '{{ item.src }}'
        dest: '{{ item.dest }}'
        owner: clickhouse
        group: clickhouse
        mode: '0644'
      loop:
        - {src: listener.xml.j2, dest: /etc/clickhouse-server/config.d/listener.xml}
        - {src: networks.xml.j2, dest: /etc/clickhouse-server/users.d/networks.xml}
      notify: Restart ClickHouse
      when: not ansible_check_mode
    - name: Start ClickHouse
      ansible.builtin.service:
        name: clickhouse-server
        state: started
        enabled: true
      when: not ansible_check_mode
    - name: Apply configuration
      ansible.builtin.meta: flush_handlers
    - name: Inspect database
      ansible.builtin.command:
        argv: [clickhouse-client, --query, 'EXISTS DATABASE {{ clickhouse_database }}']
      register: clickhouse_database_state
      changed_when: false
      when: not ansible_check_mode
    - name: Create database
      ansible.builtin.command:
        argv: [clickhouse-client, --query, 'CREATE DATABASE {{ clickhouse_database }}']
      changed_when: true
      when: not ansible_check_mode and clickhouse_database_state.stdout == '0'
    - name: Inspect table
      ansible.builtin.command:
        argv: [clickhouse-client, --query, 'EXISTS TABLE {{ clickhouse_database }}.events']
      register: clickhouse_table_state
      changed_when: false
      when: not ansible_check_mode
    - name: Create table
      ansible.builtin.command:
        argv:
          - clickhouse-client
          - --query
          - 'CREATE TABLE {{ clickhouse_database }}.events (message String) ENGINE = MergeTree ORDER BY tuple()'
      changed_when: true
      when: not ansible_check_mode and clickhouse_table_state.stdout == '0'
  handlers:
    - name: Restart ClickHouse
      ansible.builtin.service:
        name: clickhouse-server
        state: restarted

- name: Install Vector
  hosts: vector
  become: true
  tags: [vector]
  tasks:
    - name: Download Vector
      ansible.builtin.get_url:
        url: 'https://packages.timber.io/vector/{{ vector_version }}/vector_{{ vector_version }}-1_amd64.deb'
        dest: '/var/tmp/vector_{{ vector_version }}.deb'
        mode: '0644'
    - name: Install Vector
      ansible.builtin.apt:
        deb: '/var/tmp/vector_{{ vector_version }}.deb'
      when: not ansible_check_mode
    - name: Configure Vector
      ansible.builtin.template:
        src: vector.yaml.j2
        dest: /etc/vector/vector.yaml
        owner: root
        group: vector
        mode: '0640'
        validate: /usr/bin/vector validate --no-environment %s
      notify: Restart Vector
      when: not ansible_check_mode
    - name: Start Vector
      ansible.builtin.service:
        name: vector
        state: started
        enabled: true
      when: not ansible_check_mode
  handlers:
    - name: Restart Vector
      ansible.builtin.service:
        name: vector
        state: restarted

- name: Install LightHouse
  hosts: lighthouse
  become: true
  tags: [lighthouse]
  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: [nginx, unzip]
        update_cache: true
        cache_valid_time: 3600
    - name: Create static directory
      ansible.builtin.file:
        path: '{{ lighthouse_root }}'
        state: directory
        mode: '0755'
    - name: Download LightHouse
      ansible.builtin.get_url:
        url: 'https://github.com/VKCOM/lighthouse/archive/{{ lighthouse_version }}.zip'
        dest: /var/tmp/lighthouse.zip
        mode: '0644'
    - name: Extract LightHouse
      ansible.builtin.unarchive:
        src: /var/tmp/lighthouse.zip
        dest: '{{ lighthouse_root }}'
        remote_src: true
        creates: '{{ lighthouse_root }}/lighthouse-{{ lighthouse_version }}/index.html'
      when: not ansible_check_mode
    - name: Configure Nginx
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: /etc/nginx/sites-available/lighthouse
        mode: '0644'
      notify: Reload Nginx
      when: not ansible_check_mode
    - name: Enable LightHouse
      ansible.builtin.file:
        src: /etc/nginx/sites-available/lighthouse
        dest: /etc/nginx/sites-enabled/lighthouse
        state: link
      notify: Reload Nginx
      when: not ansible_check_mode
    - name: Disable default site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload Nginx
    - name: Start Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
      when: not ansible_check_mode
  handlers:
    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
